# AgendaFácil — telegram-mtproto (lista grupos via Teleproto)
# Deploy na VPS Hostinger:
#   1. Copie esta pasta para a VPS (ex.: /opt/agenda-facil/telegram-mtproto)
#   2. Copie .env.example para .env e preencha os valores reais
#   3. docker compose up -d --build
#   4. curl http://127.0.0.1:3037/health  (esperado: {"ok":true})
#
# IMPORTANTE: a porta fica ligada só em 127.0.0.1 da VPS (não exponha
# no firewall/Cloudflare). O Laravel chama via TELEGRAM_MTPROTO_URL
# interna, ex.: http://127.0.0.1:3037

services:
  telegram-mtproto:
    build: .
    container_name: agenda-telegram-mtproto
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?defina TELEGRAM_API_ID no .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?defina TELEGRAM_API_HASH no .env}
      # Dentro do container precisa ser 0.0.0.0; o compose publica só em 127.0.0.1
      TELEGRAM_MTPROTO_HOST: 0.0.0.0
      TELEGRAM_MTPROTO_PORT: ${TELEGRAM_MTPROTO_PORT:-3037}
      # Mesmo valor do TELEGRAM_MTPROTO_SERVICE_TOKEN do .env do Laravel
      TELEGRAM_MTPROTO_SERVICE_TOKEN: ${TELEGRAM_MTPROTO_SERVICE_TOKEN:?defina TELEGRAM_MTPROTO_SERVICE_TOKEN no .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${TELEGRAM_MTPROTO_PORT:-3037}:3037"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3037/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
