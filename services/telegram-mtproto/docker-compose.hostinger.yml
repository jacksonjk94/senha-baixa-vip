# SenhaBaixa VIP — telegram-mtproto (deploy na VPS Hostinger)
#
# OPÇÃO B (painel Hostinger → Gerenciador Docker → Compose → importar por URL):
#   Cole EXATAMENTE esta URL (é o arquivo YAML "raw", não a URL do repo):
#   https://raw.githubusercontent.com/jacksonjk94/senha-baixa-vip/main/services/telegram-mtproto/docker-compose.hostinger.yml
#   NÃO cole a URL de build (https://github.com/...git#main:...) — ela retorna
#   página HTML, não YAML, e o painel responde "Docker project not found".
#   No painel, preencha: TELEGRAM_API_ID, TELEGRAM_API_HASH,
#   TELEGRAM_MTPROTO_SERVICE_TOKEN (opcionais: TELEGRAM_MTPROTO_PORT=3037,
#   TZ=America/Sao_Paulo). NÃO cole caminho local Windows (d:\...) no painel.
#
# OPÇÃO A (via SSH na VPS, dispensa o painel):
#   git clone https://<SEU_TOKEN>@github.com/jacksonjk94/senha-baixa-vip.git /opt/senha-baixa-vip
#   cd /opt/senha-baixa-vip/services/telegram-mtproto
#   cp .env.example .env && nano .env   # preencha API_ID, API_HASH, SERVICE_TOKEN
#   docker compose up -d --build
#   curl http://127.0.0.1:3037/health   # esperado: {"ok":true}
#
# Depois aponte o TELEGRAM_MTPROTO_URL do Laravel para http://IP-DA-VPS:3037
# e libere a porta 3037 no firewall da VPS (o token autentica as chamadas).

name: senha-baixa-vip-mtproto

services:
  telegram-mtproto:
    build:
      context: https://github.com/jacksonjk94/senha-baixa-vip.git#main:services/telegram-mtproto
      dockerfile: Dockerfile
    image: senha-baixa-vip-telegram-mtproto:latest
    container_name: senha-baixa-vip-mtproto
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?defina TELEGRAM_API_ID no painel}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?defina TELEGRAM_API_HASH no painel}
      TELEGRAM_MTPROTO_HOST: 0.0.0.0
      TELEGRAM_MTPROTO_PORT: ${TELEGRAM_MTPROTO_PORT:-3037}
      TELEGRAM_MTPROTO_SERVICE_TOKEN: ${TELEGRAM_MTPROTO_SERVICE_TOKEN:?defina TELEGRAM_MTPROTO_SERVICE_TOKEN no painel}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${TELEGRAM_MTPROTO_PORT:-3037}:3037"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3037/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
